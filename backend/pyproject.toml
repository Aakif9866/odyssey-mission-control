[project]
name = "odyssey"
version = "0.1.0"
description = "Odyssey — AI space mission control backend (RAG, LangGraph, evals)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.163.0",
    "langchain-core>=1.8.0",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-postgres>=3.2.1",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "openai>=3.51.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.9",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "qdrant-client[fastembed]>=1.20.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
